name: progetto-iot

services:
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: iot-mqtt
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "1883:1883"
      - "8883:8883"
      - "9001:9001"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mqtt/aclfile:/mosquitto/config/aclfile:ro
      - ./mqtt/passwd:/mosquitto/config/passwd:ro
      - ./mqtt/certs:/mosquitto/certs:ro
      - ./mqtt/data:/mosquitto/data
      - ./mqtt/log:/mosquitto/log

  postgres:
    image: postgres:16-alpine
    container_name: iot-postgres
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-progetto_iot}
      POSTGRES_USER: ${POSTGRES_USER:-iot_backend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in cloud/.env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iot_backend} -d ${POSTGRES_DB:-progetto_iot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-migrations:
    build:
      context: ./backend
    container_name: iot-backend-migrations
    restart: "no"
    env_file:
      - ./backend/.env
    environment:
      IOT_BACKEND_MQTT_HOST: mqtt
      IOT_BACKEND_MQTT_PORT: 8883
      IOT_BACKEND_MQTT_USE_TLS: "true"
      IOT_BACKEND_MQTT_CA_FILE: /mqtt/certs/ca.crt
      IOT_BACKEND_MQTT_PASSWORD: ${MQTT_BACKEND_PASSWORD:-CAMBIA_QUESTA_PASSWORD_BACKEND}
      IOT_BACKEND_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-iot_backend}:${POSTGRES_PASSWORD:-CAMBIA_QUESTA_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-progetto_iot}
      IOT_BACKEND_FIREBASE_CREDENTIALS_FILE: /firebase/service-account.json
    volumes:
      - ./mqtt/certs:/mqtt/certs:ro
      - ./firebase:/firebase:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "alembic", "upgrade", "head"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    build:
      context: ./backend
    container_name: iot-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      IOT_BACKEND_MQTT_HOST: mqtt
      IOT_BACKEND_MQTT_PORT: 8883
      IOT_BACKEND_MQTT_USE_TLS: "true"
      IOT_BACKEND_MQTT_CA_FILE: /mqtt/certs/ca.crt
      IOT_BACKEND_MQTT_PASSWORD: ${MQTT_BACKEND_PASSWORD:-CAMBIA_QUESTA_PASSWORD_BACKEND}
      IOT_BACKEND_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-iot_backend}:${POSTGRES_PASSWORD:-CAMBIA_QUESTA_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-progetto_iot}
      IOT_BACKEND_FIREBASE_CREDENTIALS_FILE: /firebase/service-account.json
      IOT_BACKEND_AI_MODELS_DIR: /model-metrics
    ports:
      - "8080:8080"
    volumes:
      - ./mqtt/certs:/mqtt/certs:ro
      - ./firebase:/firebase:ro
      - ./model-metrics:/model-metrics:ro
    depends_on:
      backend-migrations:
        condition: service_completed_successfully
      mqtt:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=5)\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backend-mqtt-worker:
    build:
      context: ./backend
    container_name: iot-backend-mqtt-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      IOT_BACKEND_MQTT_HOST: mqtt
      IOT_BACKEND_MQTT_PORT: 8883
      IOT_BACKEND_MQTT_USE_TLS: "true"
      IOT_BACKEND_MQTT_CA_FILE: /mqtt/certs/ca.crt
      IOT_BACKEND_MQTT_PASSWORD: ${MQTT_BACKEND_PASSWORD:-CAMBIA_QUESTA_PASSWORD_BACKEND}
      IOT_BACKEND_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-iot_backend}:${POSTGRES_PASSWORD:-CAMBIA_QUESTA_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-progetto_iot}
      IOT_BACKEND_FIREBASE_CREDENTIALS_FILE: /firebase/service-account.json
    volumes:
      - ./mqtt/certs:/mqtt/certs:ro
      - ./firebase:/firebase:ro
    depends_on:
      backend:
        condition: service_healthy
    command: ["python", "-m", "app.mqtt.worker"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres-data:

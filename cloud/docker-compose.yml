name: progetto-iot

services:
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: iot-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8883:8883"
      - "9001:9001"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mqtt/aclfile:/mosquitto/config/aclfile:ro
      - ./mqtt/passwd:/mosquitto/config/passwd:ro
      - ./mqtt/certs:/mosquitto/certs:ro
      - ./mqtt/data:/mosquitto/data
      - ./mqtt/log:/mosquitto/log

  postgres:
    image: postgres:16-alpine
    container_name: iot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-progetto_iot}
      POSTGRES_USER: ${POSTGRES_USER:-iot_backend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in cloud/.env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iot_backend} -d ${POSTGRES_DB:-progetto_iot}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

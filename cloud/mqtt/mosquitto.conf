# Mosquitto configuration for the IoT project.
#
# Local development keeps 1883 available for quick tests.
# TLS on 8883 and WSS on 9001 are enabled with mounted certificates.

per_listener_settings true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
connection_messages true

# Retained messages are available only for explicit "current state" publishers.
# Mosquitto cannot enforce per-topic retain rules with a plain ACL file, so the
# publisher/subscriber tests verify that telemetry and alert messages are sent
# without retain while status messages can use retain intentionally.
retain_available true
check_retain_source true

# Local development listener.
listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/aclfile

# TLS listener for Cloud/VPS deployment.
listener 8883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/aclfile
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# MQTT over WebSockets for browser/client testing if needed.
listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/aclfile
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

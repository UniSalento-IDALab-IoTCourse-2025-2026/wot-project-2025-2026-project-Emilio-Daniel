patient:
  id: patient-001

window:
  minutes: 4
  timezone: Europe/Rome
  # Google Health puo' sincronizzare il battito con alcuni minuti di ritardo.
  # Quando window-end e' "now", il runtime legge una finestra gia' consolidata.
  data_delay_minutes: 12

paths:
  latest_window_csv: data/processed/latest_window.csv
  baseline_csv: data/processed/baseline.csv

ai:
  generic_model: models/generic_spatial.pkl
  generic_spatial_model: models/generic_spatial.pkl
  generic_wearable_model: models/generic_wearable.pkl
  personal_model: models/patient-001.pkl
  baseline_gate_enabled: true
  baseline_gate_block_score: 60.0

fitbit:
  enabled: false
  token_file: config/fitbit_token.json
  client_file: config/fitbit_client.json
  user_id: "-"
  api_base_url: https://api.fitbit.com

google_health:
  enabled: true
  token_file: config/google_health_token.json
  client_file: config/google_health_client.json
  api_base_url: https://health.googleapis.com

ble:
  enabled: true
  raw_csv: data/raw/ble_samples.csv
  scanner_room: living_room
  scanner_id: rpi-main
  target_addresses: []
  target_names: []
  allow_unfiltered_scan: false
  scan_seconds: 30
  rssi_min: -95
  tx_power_at_1m: -59
  path_loss_exponent: 2.0

shelly:
  enabled: false
  raw_csv: data/raw/shelly_samples.csv
